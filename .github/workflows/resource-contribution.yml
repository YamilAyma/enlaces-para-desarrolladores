name: Resource contribution recognition

on:
  pull_request_target:
    types: [opened, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  label-resource:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Detect newly added resources and label PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo, pr = os.environ["REPO"], os.environ["PR"]
          def api(path, *args):
              return subprocess.run(["gh", "api", path, *args], text=True, capture_output=True, check=True).stdout
          files = json.loads(api(f"repos/{repo}/pulls/{pr}/files", "--paginate"))
          if len(files) != 1 or files[0]["filename"] != "README.md":
              print("Not a README-only resource PR; leave classification manual.")
              raise SystemExit(0)
          patch = files[0].get("patch") or ""
          if not patch:
              print("No patch available; leave classification manual.")
              raise SystemExit(0)
          pattern = re.compile(r"^\s*-\s*\[[^\]]+\]\((https?://[^)]+)\)\s*:\s*\S+")
          added, removed = set(), set()
          for line in patch.splitlines():
              if line.startswith(("+++", "---")):
                  continue
              if line.startswith(("+", "-")):
                  match = pattern.match(line[1:])
                  if match:
                      (added if line[0] == "+" else removed).add(match.group(1).rstrip("/"))
          if not (added - removed):
              print("No new resource URL detected.")
              raise SystemExit(0)
          label = "contribution: resource"
          try:
              api(f"repos/{repo}/labels", "-f", f"name={label}", "-f", "color=0E8A16", "-f", "description=New developer tool or resource")
          except subprocess.CalledProcessError:
              pass  # Existing label; the add operation below still verifies access.
          api(f"repos/{repo}/issues/{pr}/labels", "-f", f"labels[]={label}")
          print("Resource contribution label applied.")
          PY

  thank-on-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Thank merged resource contributors once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo, pr = os.environ["REPO"], os.environ["PR"]
          def api(path, *args):
              return subprocess.run(["gh", "api", path, *args], text=True, capture_output=True, check=True).stdout
          issue = json.loads(api(f"repos/{repo}/issues/{pr}"))
          if "contribution: resource" not in [x["name"] for x in issue["labels"]]:
              print("Not labeled as a resource contribution.")
              raise SystemExit(0)
          marker = "<!-- resource-contribution-merge-thanks -->"
          comments = json.loads(api(f"repos/{repo}/issues/{pr}/comments", "--paginate"))
          if any(marker in c.get("body", "") for c in comments):
              print("Thank-you comment already exists.")
              raise SystemExit(0)
          message = """🎉 **Your contribution has been merged!**

          Thank you for sharing a resource with our developer community! Your addition can now help other developers discover something useful.

          If you enjoy this collection, consider giving the [repository](https://github.com/YamilAyma/enlaces-para-desarrolladores) a ⭐. It's completely optional, and it helps more people discover resources like yours.

          Thanks again for contributing! 🚀

          """ + marker
          api(f"repos/{repo}/issues/{pr}/comments", "-f", f"body={message}")
          print("Thank-you comment posted.")
          PY
