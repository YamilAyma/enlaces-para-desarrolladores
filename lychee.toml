# Configuración personalizada de Lychee para evitar falsos positivos
# Documentación: https://github.com/lycheeverse/lychee#configuration

# Lista de URLs o patrones regex a excluir de la validación
exclude = [
  'https://shoogle\.dev/.*',
  'https://www\.freeimages\.com/.*',
  'https://simpleicons\.org/.*',
  'https://www\.reshot\.com/.*',
  'https://medium\.com/.*',
  'https://chatgpt\.com/.*',
  'https://claude\.ai/.*',
  'https://gemini\.google\.com/.*',
  'https://chat\.mistral\.ai/.*',
  'https://danmallteaches\.substack\.com/.*',
  'https://javascriptkicks\.com/.*',
  'https://maxibestof\.one/.*',
  'https://pageflows\.com/.*',
  'https://windytoolbox\.com/.*',
  'https://www\.lapa\.ninja/.*',
  'https://www\.showfont\.net/.*',
  'https://codepen\.io/.*',
  'https://www\.reddit\.com/.*',
  'https://cursor\.directory/.*',
  'https://digger\.tools/.*',
  'https://easyfrontend\.com/.*',
  'https://motion-primitives\.com/.*',
  'https://reporoast\.app/.*',
  'https://web-check\.xyz/.*',
  'https://www\.builtatlightspeed\.com/.*',
  'https://www\.kdnuggets\.com/.*',
  'https://www\.streamlinehq.com/.*',
  'https://www\.uxsnaps\.com/.*',
  'https://linux\.do/.*',
  'https://www\.csdn\.net/.*',
  'https://docs\.google\.com/.*',
  'https://fakeimg\.pl/.*'
]

# Códigos de estado HTTP aceptables
accept = [
  '200..299',
  '301',
  '302',
  '308'
]

# Aumentar la resiliencia de las peticiones
timeout = 15
max_retries = 3
max_concurrency = 10

# Admitir redirecciones de forma segura
max_redirects = 5
